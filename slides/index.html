<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="用 Campusward 理解 AI 搜課、排課與檢查，附原始來源與實際製作紀錄"><title>AI 搜課、排課與檢查簡報｜Campusward 教學</title><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="deck.css"></head><body><a class="skip-link" href="#main">跳到內容</a><header class="site-header"><a class="brand" href="../index.html">Campusward <small>教學 Wiki</small></a><nav class="site-nav" aria-label="主要導覽"><a href="../index.html">教學 Wiki</a><a href="../slides/index.html">看簡報</a><a href="../workflow.html">流程與紀錄</a><a href="../sources/index.html">來源</a></nav></header><main id="main"><div id="deck"><div id="slide-host" aria-live="off"><p>正在載入簡報，若沒有載入，請回 Wiki 觀看同一份教材。</p></div><noscript><div class="article"><section><h2>AI 怎麼幫你搜課、排課與檢查</h2><p>用 Campusward 看懂一句需求，怎麼變成一份可檢查的課表</p><p>看完後，你會知道 AI 負責提建議，程式負責查資料和比規則，最後哪些事還是要自己確認。</p></section><section><h2>先把「想要」和「不能」分開</h2><p>「想找設計課，週三空下來，必修不要動」</p><p>想找設計課，是搜尋方向；週三空下來、必修不要動，是要檢查的條件。</p><p>這是固定教學需求，不代表真的替你搜課，也沒有送到 AI。</p></section><section><h2>AI 說找什麼，工具去查課程資料</h2><p>搜尋工具就像課程目錄，讓模型有實際課號可用</p><p>教材引用的公開版先問 AI，第一輪沒有提出變更、又要求搜課時，程式才查課程資料，把結果交給第二輪。</p><p>11 月 18 日本機版只要第一輪要求搜課就先查，例如 AI 把需求整理成「週五下午 2學分 通識 不要早八」，程式就按這些條件篩課。</p><p>流程最多兩輪，切換備用模型時可能多送一次請求。</p></section><section><h2>建議先寫成一張表單</h2><p>JSON 就像有固定欄位的表單，程式比較容易讀</p><p>把要加入、移除的課整理成資料，先檢查格式，再檢查能不能做。</p><p>格式正確，只代表讀得懂，還不能保證內容正確或時間沒衝突。</p></section><section><h2>新造成的衝堂會被擋下</h2><p>AI 的方案還要過規則這一關</p><p>檢查上課時間、學分上限、空堂日和修課資格，套用時也會處理鎖定課與未知課號。</p><p>程式會比較變更前後，擋下新出現的衝堂等問題，也會比對學分、實習天數有沒有變差，原本就有的問題還是要回課表看提醒。</p><p>11 月 18 日本機版可以從最近一次已套用的 AI 修改回覆按「復原」，直到課表再有變動。</p></section><section><h2>換一個班，真的就能排嗎</h2><p>自己試試看：時間不衝突，還可能撞到空堂日</p><p>先檢查週二那班，再換到週三，最後勾選保留週三空堂，比較三次結果。</p></section><section><h2>問課綱，就先翻到相關段落</h2><p>RAG 像開書回答：先找資料，再整理答案</p><p>先檢索本機課綱，再把問題和相關片段交給模型，資料沒寫的就要明說。</p><p>這個產品版本沒有因此就變成向量資料庫，教材要照實際做法說明。</p></section><section><h2>有附課號，也還要看原文</h2><p>引用合法，和回答正確，是兩件事</p><p>程式可以排除不在提供清單裡的課號，但沒有逐句查證回答。</p><p>如果 AI 說這門課不用期末考，仍要回課綱找對應段落，找不到就不能當成確定資訊。</p></section><section><h2>只把需要的資料送出去</h2><p>排課不需要把自己的所有資料都交給 AI</p><p>課綱問答送出問題和公開課綱片段，不帶課表、身分和修課紀錄。</p><p>金鑰預設在記憶體，選擇記住分頁才存該分頁的暫存區，這份教材則完全不用金鑰。</p></section><section><h2>最後確認一下，你會怎麼判斷</h2><p>AI 說這份課表沒問題，你接下來要做什麼</p></section><section><h2>記住這條流程就夠了</h2><p>說需求 → 需要時查資料 → 提方案 → 檢查 → 自己確認</p><p>AI 幫忙整理需求，搜尋提供課程資料，規則檢查會比較變更前後，擋下新造成的衝堂等問題，也會檢查學分一類的條件有沒有變差。</p><p>想看教材怎麼做，可以回 Wiki 查來源，再看製作流程和這次留下的檢查紀錄。</p></section></div></noscript></div></main><footer class="deck-controls" aria-label="簡報控制"><button id="prev" type="button">上一頁</button><span id="page-status" aria-live="polite"></span><button id="next" type="button">下一頁</button><button id="overview" type="button">全部展開</button></footer><script src="deck.js" defer></script><footer class="site-footer">非政大官方服務 · 教材依固定版本文件整理 · AI 協助摘要、製作與核對，詳見<a href="../records/ai-assistance.md">協作紀錄</a></footer><script src="../assets/site.js" defer></script></body></html>
